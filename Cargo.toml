[package]
name = "valhalla"
version = "0.2.0"
edition = "2021"
description = "Theme-aware wallpaper switcher for Linux desktops"
license = "GPL-3.0"

[profile.release]
lto = true
strip = true

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "frontend"] }
async-channel = "2.3.3"
fastrand = "2.5.0"
fslock = "0.2.1"
futures-util = "0.3.34"
gio = "0.22.10"
glib = "0.22.10"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
image = "0.25.10"
libsecret = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
glib-build-tools = "0.22.8"

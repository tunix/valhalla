# Concurrency: serialize whole release runs. Without this, a push landing
# while an earlier run is still building artifacts can interleave with the
# run that still holds an unpublished DRAFT release; release-please only
# sees PUBLISHED releases when deciding whether a new release is due, so an
# overlapping run while the draft is not yet published makes it re-package
# the SAME commits as the next version (a spurious "0.4.0" this way — its
# changelog was a byte-for-byte copy of 0.3.0's, SHAs included; see #15).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

name: Release

on:
  # Deliberately NOT path-gated: release-please must observe every merge to
  # keep the changelog complete, and it is a no-op when no release is due.
  # The artifacts job only runs when a release is actually created.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)attach artifacts to"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    # Nothing to do on a manual dispatch; skip it to save a run.
    if: github.event_name != 'workflow_dispatch'
    steps:
      # NOTE: deliberately no `release-type` input here. Setting it switches
      # the action to its Manifest.fromConfig() code path, which ignores
      # release-please-config.json (repo root) entirely — including
      # "draft": true — so the release is created PUBLISHED (immutable) and
      # the later artifact uploads fail with "Cannot upload asset ... to an
      # immutable release". Without the input the action reads the config
      # file itself (DEFAULT_CONFIG_FILE = 'release-please-config.json',
      # i.e. at the repo ROOT, not under .github/).
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release

  artifacts:
    name: Package release artifacts (${{ matrix.arch }})
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: >
          dnf install -y rust cargo rustfmt clippy gcc pkgconf-pkg-config
          gtk4-devel libadwaita-devel libsecret-devel glib2-devel
          blueprint-compiler git

      - name: Cache cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /root/.cargo/registry
            /root/.cargo/git
          key: fedora-cargo-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: fedora-cargo-${{ matrix.arch }}-

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball
        run: |
          install -D -m 0755 target/release/valhalla "valhalla-${TAG}/valhalla"
          install -D -m 0644 data/valhalla.service "valhalla-${TAG}/data/valhalla.service"
          tar -czf "valhalla-${TAG}-${ARCH}.tar.gz" "valhalla-${TAG}"

      # The release is created as a draft by release-please (see
      # release-please-config.json at the repo root): uploads must happen before
      # publication because immutable releases reject late asset uploads.
      - name: Upload release artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          files: valhalla-*-${{ matrix.arch }}.tar.gz

  publish:
    name: Publish release
    needs: [release-please, artifacts]
    if: always() && needs.artifacts.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # gh release edit always sends tag_name in the PATCH, which immutable
      # releases reject; publish with a minimal PATCH body instead.
      - name: Flip the draft release to published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH="Authorization: Bearer ${GITHUB_TOKEN}"
          BASE="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          # Prefer the draft matching this tag; fall back to the published
          # release by tag (a draft does not create the tag ref, so a 404 on
          # the tag endpoint does NOT mean the release is missing).
          RELEASE_ID=$(curl -sSf -H "$AUTH" \
            "${BASE}/releases?per_page=100" \
            | jq -r --arg tag "${TAG}" '[.[] | select(.draft and .tag_name == $tag)][0].id // empty')

          if [ -z "${RELEASE_ID}" ]; then
            # No matching draft: either already published or never created.
            HTTP=$(curl -sS -o /tmp/rel.json -w '%{http_code}' -H "$AUTH" \
              "${BASE}/releases/tags/${TAG}")
            if [ "${HTTP}" = "200" ] && [ "$(jq -r '.draft' /tmp/rel.json)" = "false" ]; then
              echo "Release ${TAG} is already published - nothing to do."
              exit 0
            fi
            if [ "${HTTP}" = "404" ]; then
              echo "WARNING: no draft and no published release for ${TAG} - nothing to publish."
              exit 0
            fi
            echo "ERROR: unexpected HTTP ${HTTP} looking up ${TAG}:" >&2
            cat /tmp/rel.json >&2
            exit 1
          fi

          HTTP=$(curl -sS -o /tmp/pub.json -w '%{http_code}' -X PATCH \
            -H "$AUTH" \
            "${BASE}/releases/${RELEASE_ID}" \
            -d '{"draft": false}')
          if [ "${HTTP}" != "200" ]; then
            echo "ERROR: PATCH ${RELEASE_ID} failed with HTTP ${HTTP}:" >&2
            cat /tmp/pub.json >&2
            exit 1
          fi
          echo "Release ${TAG} published"

  guard:
    # release-please computes the next release from the last PUBLISHED
    # release. While a draft is still waiting for artifacts, it will happily
    # open a NEW release PR packaging the SAME commits as the next version —
    # that is how the spurious "0.4.0" PR (#15) appeared: its changelog was
    # a byte-for-byte copy of 0.3.0's, commit SHAs included. Such a PR is
    # never mergeable content, so close it automatically once the real
    # release is published.
    name: Close duplicate release PR
    needs: [release-please, publish]
    # Only relevant when this run actually published a release.
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Sweep duplicate release PRs created while the draft was open
        run: |
          set -euo pipefail
          BASE="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          python3 - "${BASE}" "${TAG}" <<'PY'
          import base64, json, os, re, sys, urllib.request

          base, tag = sys.argv[1], sys.argv[2]
          HEADERS = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                     "Accept": "application/vnd.github+json",
                     "Content-Type": "application/json"}

          def api(path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(base + path, data=data,
                  method="PATCH" if payload is not None else "GET", headers=HEADERS)
              return json.load(urllib.request.urlopen(req))

          # SHAs of the commits listed under the tag we just published, from
          # the changelog on main (post-merge of THIS release PR).
          def section_shas(text, heading_re):
              m = re.search(heading_re, text)
              if not m:
                  return set()
              rest = text[m.end():]
              nxt = re.search(r"(?m)^## \[", rest)
              body = rest[: nxt.start()] if nxt else rest
              clean = re.sub(r"(?m)^\+", "", body)
              return set(re.findall(r"\[([0-9a-f]{7,40})\]\(https://github\.com/", clean))

          changelog = api("/contents/CHANGELOG.md?ref=main")
          changelog_text = base64.b64decode(changelog["content"]).decode()
          # The changelog heading uses the bare version ("## [0.3.0](...)"),
          # not the tag name; TAG arrives as "valhalla-v0.3.0".
          version = tag.rsplit("v", 1)[-1]
          shas = section_shas(changelog_text,
                              re.compile(r"(?m)^## \[" + re.escape(version) + r"\]"))

          for pr in api("/pulls?state=open&per_page=100"):
              if not re.match(r"^chore\(main\): release ", pr["title"]):
                  continue
              # Duplicate signature: its changelog lists EXACTLY the commits
              # of the release we just published (no new work at all).
              # Diff patches prefix changed lines with '+' — strip it and
              # match the added section heading accordingly.
              files = api(f"/pulls/{pr['number']}/files")
              head = next((f for f in files if f["filename"] == "CHANGELOG.md"), None)
              pr_shas = section_shas(head["patch"], re.compile(r"(?m)^\+## \[")) if head else set()
              if shas and pr_shas == shas:
                  print(f"Closing duplicate release PR #{pr['number']}: {pr['title']} (same commit set as published {tag})")
                  print("  ->", api(f"/pulls/{pr['number']}", {"state": "closed"})["state"])
              else:
                  print(f"Keeping PR #{pr['number']} ({pr['title']}): commit set differs from {tag} — looks like real work")
          PY

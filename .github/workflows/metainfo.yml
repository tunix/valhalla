name: Update metainfo releases

# release-please maintains CHANGELOG.md but never the appstream metainfo;
# without this job the packaged <releases> data drifts behind the actual
# releases (it was stuck at 0.3.0 while the app moved to 1.3.1, which also
# makes `flatpak info` report the wrong Version).
on:
  push:
    branches: [main]
    paths: ["CHANGELOG.md"]

permissions:
  contents: write
  pull-requests: write

jobs:
  metainfo:
    name: Sync metainfo <releases>
    if: github.repository == 'tunix/valhalla'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # update_metainfo.py exits 1 when it REWROTE the metainfo (0 = already
      # current, 2 = error). The default step shell is `bash -e {0}`, which
      # would kill this step on the expected rewrite — the 1.3.2 sync never
      # opened its PR because of that. Accept exit 1 explicitly.
      - name: Regenerate <releases> from the changelog
        run: python3 scripts/update_metainfo.py || [ $? -eq 1 ]

      - name: Validate the metainfo
        run: python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('data/io.github.tunix.valhalla.metainfo.xml')"

      # No-op when the script found nothing to change (exit 0).
      - name: Open a PR when the metainfo changed
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(data): sync metainfo <releases> with the changelog"
          title: "chore(data): sync metainfo <releases> with the changelog"
          body: |
            Automated sync of the appstream `<releases>` block from
            CHANGELOG.md (release-please never touches the metainfo).
            Generated by scripts/update_metainfo.py.
          branch: chore/metainfo-releases
          delete-branch: true
          add-paths: data/io.github.tunix.valhalla.metainfo.xml
